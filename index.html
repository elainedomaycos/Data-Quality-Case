*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:20px/1.2 'VT323',monospace}
h1,h2,h3,.pf{font-family:'Press Start 2P',sans-serif;font-weight:600;letter-spacing:.03em;text-transform:uppercase;line-height:1.4;margin:0}h1{font-size:16px}h2{font-size:11px;color:var(--cy)}h3{font-size:9px;color:var(--cy)}
#app{height:100%}
.bg{background:linear-gradient(#06111c33,#06111c88),var(--scene) center bottom/cover;min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.pan{position:relative;background:linear-gradient(180deg,#0e2b42f2,#08192af2);border:1px solid var(--line);border-radius:3px;box-shadow:0 0 0 1px #020a12,0 0 16px #2aa6c02e,inset 0 0 22px #020a1299;padding:12px}
.pan::before,.pan::after{content:"";position:absolute;width:9px;height:9px;border:2px solid var(--cy);pointer-events:none}.pan::before{top:-2px;left:-2px;border-right:0;border-bottom:0}.pan::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.par{position:relative;background:linear-gradient(160deg,#f1e1b6,#e0c58a);color:var(--ink);border:2px solid #8a6534;border-radius:3px;box-shadow:0 14px 34px #000a,inset 0 0 46px #b8894050;padding:24px}
.par::before{content:"";position:absolute;top:-15px;left:22px;width:96px;height:15px;background:#e6cf9a;border:2px solid #8a6534;border-bottom:0;border-radius:5px 5px 0 0}
.par h3{color:#7a2a1c}.par h1{color:#3a2410}.par h2{color:#7a2a1c}
.logo{color:#7a4a1c;margin-bottom:6px}.stamp{display:inline-block;border:2px solid #9a3a22;color:#9a3a22;font:9px 'Press Start 2P',monospace;letter-spacing:.03em;padding:2px 10px;margin:10px 0;transform:rotate(-3deg)}
.q{font-style:italic;font-size:22px}.foot{font-size:16px;opacity:.6;letter-spacing:.03em;text-transform:uppercase}.wide{width:80%;display:block;margin:8px auto}
.btn{font:9px 'Press Start 2P',monospace;letter-spacing:.03em;text-transform:uppercase;background:linear-gradient(#123e56,#0b2a3d);color:#d4f3fb;border:1px solid var(--line);border-radius:2px;padding:10px 14px;cursor:pointer;margin:3px;box-shadow:inset 0 0 10px #2aa6c02a}
.btn:hover{background:linear-gradient(#1a5877,#0f3c4d);filter:brightness(1.15)}
.btn.pr{background:linear-gradient(#ea7434,#b8431a);border-color:#f4975a;color:#fff;box-shadow:0 0 12px #e0662b44}
.btn.g{background:linear-gradient(#17876a,#0e5a47);border-color:var(--teal)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.s{font-size:8px;padding:6px 9px}
.btn.wide{margin:8px auto}
.btn:focus-visible,input:focus-visible,select:focus-visible,.nv:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
input,select,textarea{font:20px 'VT323',monospace;background:#051220;color:var(--tx);border:1px solid var(--line);border-radius:2px;padding:6px 8px;width:100%;margin:2px 0 8px}
.par input,.par textarea{background:#fff8e6;color:var(--ink);border-color:#8a6534}
.chip{display:inline-block;font:8px 'Press Start 2P',monospace;letter-spacing:.03em;border:1px solid var(--line);padding:4px 10px;margin-left:6px;border-radius:2px;background:#061a2a}.chip.xp{color:var(--amb);border-color:var(--amb)}
.lg{display:flex;align-items:center;gap:10px;color:var(--cy)}
.lbl{font:7px 'Press Start 2P',monospace;letter-spacing:.03em;color:#7fb3c4;margin:10px 0 3px;text-transform:uppercase}.mis{font:8px 'Press Start 2P',monospace;color:var(--amb);letter-spacing:.03em}
.meter{height:10px;background:#04101a;border:1px solid var(--line);border-radius:2px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#2aa6c0,var(--teal))}
.meter .fill{width:0;animation:fl 3.4s ease-out forwards}@keyframes fl{to{width:100%}}
.hub{background:linear-gradient(#06111cb8,#06111cd8),var(--scene) center/cover;display:grid;grid-template-columns:190px 1fr 260px;grid-template-rows:auto 1fr auto;gap:8px;height:100%;padding:8px;min-width:1000px}
.top{grid-column:1/4;display:flex;justify-content:space-between;align-items:center;font:9px 'Press Start 2P',monospace;letter-spacing:.03em;padding:8px 14px}
.side{overflow:auto}.side h3{margin:12px 0 5px}.nv{padding:6px 8px;cursor:pointer;border-left:2px solid transparent;border-radius:2px}.nv:hover,.nv.on{background:#124160;border-color:var(--org);color:#fff}
.ctr{overflow:auto;min-height:0;display:flex;flex-direction:column}
.guide{grid-column:1/4;display:flex;gap:12px;align-items:center;min-height:100px}.guide img{width:84px;height:84px;object-fit:cover;object-position:top;border:2px solid var(--line);border-radius:2px;background:#fff}
.guide .nm{font:9px 'Press Start 2P',monospace;letter-spacing:.03em;color:var(--amb);margin-bottom:5px}.guide .tx{flex:1;font-size:22px}
.tw{overflow:auto;flex:1;min-height:80px;border:1px solid var(--line);border-radius:2px}table.t{border-collapse:collapse;width:100%;font-size:19px}
.t th{position:sticky;top:0;background:#123a55;color:#a5e6f5;font:9px 'Press Start 2P',monospace;letter-spacing:.03em;padding:6px 10px;text-align:left;cursor:pointer;border:1px solid #071826;white-space:nowrap}.t th.sc{background:#0f7a62;color:#fff}
.t td{padding:4px 10px;border:1px solid #c9d6de;background:#f2f6f8;color:#10202e;white-space:nowrap;cursor:pointer}.t td.sc{background:#d8f0ea}.t td.cs{outline:2px solid var(--cy);outline-offset:-2px;background:#bdeee0}.t td.ev{background:#ffe3c4;box-shadow:inset 0 0 0 2px var(--org)}
.sp{color:#d33}.t i{color:#999}.bar{height:12px;background:var(--teal);border-radius:1px;margin:2px 0 6px}
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:2px;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}.tb b{line-height:1.6;font:7px 'Press Start 2P',monospace;letter-spacing:.03em;color:var(--amb);margin:0 4px 0 10px}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:#020a12cc;display:flex;align-items:center;justify-content:center;z-index:9}.ov .pan{max-width:520px;width:92%;padding:22px}.ov h2{display:flex;align-items:center;gap:12px;margin-bottom:10px}

.card{position:relative;width:210px;background:#f5ecd2;color:var(--ink);padding:14px 10px 10px;border:1px solid #8a6534;box-shadow:3px 4px 0 #0005;cursor:pointer;font-size:19px;transform:rotate(-1deg)}.card:nth-child(even){transform:rotate(1.2deg)}
.card::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;border-radius:50%;background:radial-gradient(#ff8a70,#b8352a);box-shadow:1px 2px 2px #0006}
.card.lk{outline:3px solid var(--org)}.card b{font:7px 'Press Start 2P',monospace;letter-spacing:.03em;color:#7a2a1c;display:block;margin-bottom:5px;line-height:1.4}
.ck{display:flex;gap:6px;align-items:center;padding:2px 0}.ok{color:var(--teal)}.no{color:var(--red)}
.tst{position:fixed;top:64px;right:20px;background:var(--amb);color:#1a1000;padding:9px 14px;font:9px 'Press Start 2P',monospace;letter-spacing:.03em;z-index:10;border-radius:2px;box-shadow:0 0 14px #f0a13a66}
.rs{opacity:0;animation:fi .6s forwards}@keyframes fi{to{opacity:1}}.grid{display:grid;gap:10px}
.stk{display:flex;flex-direction:column;gap:3px;width:130px}.stk div{background:#c99a4a;border:1px solid #6a4a1c;border-radius:2px;text-align:center;color:#000}
@media(prefers-reduced-motion:reduce){.rs,.meter .fill{animation-duration:.01s}}
h1,h2,h3{line-height:1.6}.btn{line-height:1.5}.ic{font-family:sans-serif}.grp{display:contents}.lkd{display:contents}.lkd>*{opacity:.35;filter:grayscale(1);cursor:not-allowed}
*{scrollbar-width:thin;scrollbar-color:#2aa6c0 transparent}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2aa6c0;border-radius:4px}::-webkit-scrollbar-track{background:transparent}
.bg{display:flex;align-items:stretch;justify-content:center;padding:16px}.bg>*{margin:auto;max-width:100%}
.hub{min-width:0;grid-template-columns:170px minmax(0,1fr) 230px;height:100vh;height:100dvh;overflow:hidden;gap:6px;padding:6px}
.hub .pan{padding:8px}.top{padding:6px 12px!important}.side h3{margin:8px 0 3px}.nv{padding:3px 6px}
.guide{min-height:0!important;padding:6px 10px!important}.guide img{width:60px;height:60px}.guide .tx{font-size:20px}
.ctr>*{flex-shrink:0}.ctr>.tw,.ctr>.cork,.ctr>.par{flex:1 1 auto;min-height:120px;flex-shrink:1}
table.t{font-size:17px}.t td{padding:2px 8px}.t th{padding:5px 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}.two>.pan{margin:0!important}
.btn{padding:8px 10px}.btn.s{padding:5px 7px}.tb{margin-top:4px;padding-top:4px}
@media(max-width:900px){.hub{grid-template-columns:1fr;grid-template-rows:none;height:auto;overflow:visible}.top,.guide{grid-column:1}.side,.ctr{overflow:visible}.two{grid-template-columns:1fr}}
table.t td{cursor:zoom-in}table.t td:hover{outline:2px solid var(--amb);outline-offset:-2px}
#guidetx::after{content:"▌";animation:blink 1s steps(1) infinite;color:var(--amb)}@keyframes blink{50%{opacity:0}}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti i{position:absolute;top:-12px;width:8px;height:14px;opacity:.9;animation:fall 3s linear infinite}@keyframes fall{to{transform:translateY(420px) rotate(360deg)}}
.guide.m-celebrate{border-color:var(--teal);box-shadow:0 0 14px #4fe0b555}.guide.m-warn{border-color:var(--org);box-shadow:0 0 14px #e0662b55}.guide.m-think{border-color:var(--amb)}
#cert{border:3px double #7a2a1c}.sig{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:18px}.sig div{border-top:2px solid #7a2a1c;padding-top:4px;font-size:16px}
.isvg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.finale{width:min(560px,100%);text-align:center;position:relative;overflow:hidden}
.finale .stamp{display:inline-block;margin:2px 0 10px}
.finale h1{font-size:15px;line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.stat{border:1px solid var(--line);border-radius:2px;padding:10px 4px;background:#08192a}
.stat i{display:flex;justify-content:center;font-size:15px;color:var(--cy);margin-bottom:6px}
.stat b{display:block;font:11px 'Press Start 2P',monospace;color:#fff}
.stat span{display:block;font:7px 'Press Start 2P',monospace;letter-spacing:.06em;color:#7fb3c4;margin-top:6px}
.track{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:16px 0 6px}
.track div{border-top:2px solid var(--teal);padding-top:6px;font:6.5px/1.7 'Press Start 2P',monospace;letter-spacing:.04em;color:#8fe3d2}
.track div i{display:block;color:var(--teal);font-size:12px;margin-bottom:4px}
.certhead{display:flex;align-items:center;justify-content:center;gap:9px;color:#7a4a1c;margin-bottom:8px}
.certmeta{font:7px 'Press Start 2P',monospace;letter-spacing:.08em;color:#7a2a1c;opacity:.85;margin:9px 0 16px}
.certlabel{font:7px 'Press Start 2P',monospace;letter-spacing:.14em;color:#7a2a1c;opacity:.75;margin-top:18px}
.certname{font-size:21px;line-height:1.7;margin:6px 0 2px}
.certgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 2px;text-align:center}
.certgrid .stat{border-color:#8a6534;background:#fff8e6}
.certgrid .stat i{color:#9a3a22}
.certgrid .stat b{color:#3a2410;font-size:10px}
.certgrid .stat span{color:#7a2a1c;opacity:.8}
.sub{font-size:17px;opacity:.85;margin:2px 0 0}
.verdict{border:1px solid #8a6534;border-left:3px solid #12805f;background:#fff8e6;border-radius:2px;padding:10px 12px;margin-top:12px;text-align:left;font-size:16px;line-height:1.55;color:#3a2410}
.verdict b{color:#7a2a1c}
.verdict .ok{color:#12805f}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:9px}
.chipb{display:inline-flex;align-items:center;gap:5px;font:6.5px 'Press Start 2P',monospace;letter-spacing:.05em;border:1px solid #8a6534;border-radius:2px;padding:5px 8px;background:#fff8e6;color:#3a2410}
.chipb i{color:#9a3a22;font-size:10px}
.takes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:9px}
.take{border:1px solid #8a6534;border-radius:2px;background:#fff8e6;padding:9px 4px;color:#3a2410}
.take i{display:block;font-size:14px;color:#9a3a22;margin:0 auto 6px}
.take b{display:block;font:6.5px 'Press Start 2P',monospace;letter-spacing:.05em;color:#7a2a1c;margin-bottom:5px}
.take span{font-size:13px;line-height:1.4;display:block}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:26px}
.sig div{border-top:1.5px solid #7a2a1c;padding-top:6px;font:6.5px 'Press Start 2P',monospace;letter-spacing:.1em;color:#7a2a1c}
.acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:18px}
@media(max-width:560px){.certgrid{grid-template-columns:repeat(2,1fr)}.takes{grid-template-columns:repeat(2,1fr)}.track{grid-template-columns:repeat(4,1fr)}}
@media print{body{background:#fff}.bg{padding:0;background:none;display:block}.bg>*{margin:0;max-width:none}#cert{box-shadow:none;width:100%}.noprint,.tst,.ov{display:none!important}}

function merge(){const c=S.mc,tn=['Sales','Customer_Master'],P=S.tables[c.p],Q=S.tables[c.s],g=S.tables.Merged;const sel=(k,o)=>`<select onchange="S.mc.${k}=this.value;S.mc.done=0;R()">${o.map(x=>`<option ${x===c[k]?'selected':''}>${x}</option>`).join('')}</select>`;

 return`<h3>MERGE = MATCH</h3><div class=grid style="grid-template-columns:1fr 1fr"><div class=pan>Primary table${sel('p',tn)}Key${sel('pk',P.cols)}</div><div class=pan>Secondary table${sel('s',tn)}Key${sel('sk',Q.cols)}</div></div><div class=pan style="margin-top:6px">Join type${sel('jt',['Left Outer','Inner','Right Outer'])}Expand from secondary: ${Q.cols.map(x=>`<label><input type=checkbox style="width:auto" ${c.exp.includes(x)?'checked':''} onchange="S.mc.exp=this.checked?[...S.mc.exp,'${x}']:S.mc.exp.filter(y=>y!=='${x}');S.mc.done=0;R()"> ${x}</label>`).join(' ')}<br>Key check — primary values: ${[...pk].sort().map(k=>`<b class="${qk.has(k)?'ok':'no'}">${k}${qk.has(k)?'':' ✖'}</b>`).join(' ')}<br><button class="btn g" onclick="doMerge()">EXECUTE MERGE</button></div>${c.done&&g?`<div class=pan style="margin-top:6px"><h3>MERGED — ${g.rows.length} rows · click a cell to inspect it</h3>${tbl('Merged',1)}${S.sel&&S.sel.r!=null&&S.act==='Merged'&&g.rows[S.sel.r][S.sel.c]===null?`<button class="btn s pr" onclick="mEv()">ADD UNMATCHED TO EVIDENCE</button>`:''}</div>`:''}`}
function doMerge(){const c=S.mc,P=S.tables[c.p],Q=S.tables[c.s];if(c.p===c.s)return toast('Choose two different tables.');const pi=P.cols.indexOf(c.pk),qi=Q.cols.indexOf(c.sk);if(pi<0||qi<0)return toast('Key column missing.');
 const ex=c.exp.map(x=>Q.cols.indexOf(x)),cols=[...P.cols,...c.exp.map(x=>'Customer_Master.'+x)],rows=[],used=new Set();
 P.rows.forEach(r=>{const m=Q.rows.filter(q=>q[qi]===r[pi]);if(m.length)m.forEach(q=>{used.add(q);rows.push([...r,...ex.map(i=>q[i])])});else if(c.jt!=='Inner')rows.push([...r,...ex.map(()=>null)])});
 if(c.jt==='Right Outer')Q.rows.filter(q=>!used.has(q)).forEach(q=>rows.push([...P.cols.map(()=>null),...ex.map(i=>q[i])]));
 S.tables.Merged=mk(cols,rows);S.imp.Merged=1;c.done=1;S.act='Merged';S.sel=null;const u=P.rows.filter(r=>!Q.rows.some(q=>q[qi]===r[pi])).map(r=>r[pi]);say(['Merged: '+rows.length+' rows. '+(u.length?'Unmatched key(s): '+[...new Set(u)].join(', ')+'. Find the null Segment and log it.':'Every key matched.'),'Which Segment cells are null, and what does that say about the master record?'],'guide')}

 if(f==='team')h=bgw(`<div class=pan style="width:520px"><h2>CREATE YOUR INVESTIGATION TEAM</h2><p>Team Name<input value="${H(S.team.name)}" oninput="S.team.name=this.value;sv()"></p>${S.team.inv.map((x,i)=>`Investigator ${i+1}<input value="${H(x)}" oninput="S.team.inv[${i}]=this.value;sv()">`).join('')}<br><button class="btn pr" onclick="S.team.name.trim()?go('brief'):toast('Enter a team name')">OPEN CASE FILE</button> <button class="btn s" onclick="go('home')">${ico('home')} HOME</button></div>`);
 if(f==='brief')h=bgw(`<div class=par style="width:640px"><h3>CASE FILE #004 — MABINI ADVENTURES INC.</h3><p><b>SITUATION</b><br>Management has noticed inconsistencies between sales reports and customer records. Several monthly files were prepared by different staff members. The data must be investigated, transformed and validated before management can trust the dashboard.</p><p><b>ASSIGNMENT</b><br>Determine whether the company's dataset is ready for analysis.</p><p><b>OBJECTIVES</b><br>Inspect raw data · Find suspicious records · Clean the dataset · Verify data types · Connect customer and sales data · Combine monthly records · Perform a final audit</p><button class="btn pr" onclick="go('obj')">BEGIN CASE</button> <button class="btn s" onclick="go('home')">${ico('home')} HOME</button></div>`);
 if(f==='obj')h=bgw(`<div class=pan style="width:560px"><h2>INVESTIGATION OBJECTIVES</h2>${M.map((m,i)=>{const d=S.done.includes(i+1),c=i+1===S.m&&!S.done.includes(7);return`<div class=pan style="margin:6px 0;${c?'border-color:var(--teal)':''}">${d?'✓':c?'→':'🔒'} <b class=pf style="font-size:9px">MISSION 0${i+1}</b> ${m.t} <small>(${m.xp} XP)</small>${c?`<br><button class="btn g s" onclick="S.view='${i?'work':'cab'}';go('hub')">ENTER</button>`:''}</div>`}).join('')}<br><button class="btn s" onclick="go('home')">${ico('home')} HOME</button></div>`);
